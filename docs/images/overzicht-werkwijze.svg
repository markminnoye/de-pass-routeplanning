<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="auto">
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 12px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #64748b; line-height: 1.4; }
      .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #0284c7; }
      .badge-bg { fill: #e0f2fe; rx: 4px; }
      .arrow { stroke: #94a3b8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .arrow-head { fill: #94a3b8; }
      .icon-bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 8px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background subtle gradient -->
  <rect width="900" height="240" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Step 1 -->
  <g transform="translate(24, 25)">
    <rect class="card" width="190" height="190"/>
    <rect x="16" y="18" width="36" height="36" class="icon-bg"/>
    <text x="34" y="42" font-size="20" text-anchor="middle">📁</text>
    <rect x="60" y="24" width="64" height="22" class="badge-bg"/>
    <text x="92" y="39" class="badge" text-anchor="middle">STAP 1</text>
    <text x="16" y="80" class="title">Schoolgegevens</text>
    <text x="16" y="104" class="desc">
      <tspan x="16" dy="0">Leerlingen, haltes en</tspan>
      <tspan x="16" dy="18">de 7 schoolbussen.</tspan>
      <tspan x="16" dy="24" font-weight="600" fill="#0f766e">🛡️ Zero PII / Anoniem</tspan>
      <tspan x="16" dy="18">Enkel GPS-punten.</tspan>
    </text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="222" y1="120" x2="244" y2="120" class="arrow" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g transform="translate(252, 25)">
    <rect class="card" width="190" height="190"/>
    <rect x="16" y="18" width="36" height="36" class="icon-bg"/>
    <text x="34" y="42" font-size="20" text-anchor="middle">💬</text>
    <rect x="60" y="24" width="64" height="22" class="badge-bg"/>
    <text x="92" y="39" class="badge" text-anchor="middle">STAP 2</text>
    <text x="16" y="80" class="title">Vraag in Claude</text>
    <text x="16" y="104" class="desc">
      <tspan x="16" dy="0">In gewone mensentaal</tspan>
      <tspan x="16" dy="18">(Nederlands of Frans):</tspan>
      <tspan x="16" dy="22" font-style="italic" fill="#334155">"Wat als bus 3 naar</tspan>
      <tspan x="16" dy="18" font-style="italic" fill="#334155">Tienen rijdt?"</tspan>
    </text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="450" y1="120" x2="472" y2="120" class="arrow" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g transform="translate(480, 25)">
    <rect class="card" width="190" height="190"/>
    <rect x="16" y="18" width="36" height="36" class="icon-bg"/>
    <text x="34" y="42" font-size="20" text-anchor="middle">⚡</text>
    <rect x="60" y="24" width="64" height="22" class="badge-bg"/>
    <text x="92" y="39" class="badge" text-anchor="middle">STAP 3</text>
    <text x="16" y="80" class="title">Slimme Rekenhulp</text>
    <text x="16" y="104" class="desc">
      <tspan x="16" dy="0">Optimaliseert voor de</tspan>
      <tspan x="16" dy="18" font-weight="600" fill="#c2410c">kortste rit per kind</tspan>
      <tspan x="16" dy="18">(geen ritten van 2u+).</tspan>
      <tspan x="16" dy="20">Snel &amp; doeltreffend.</tspan>
    </text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="678" y1="120" x2="700" y2="120" class="arrow" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g transform="translate(708, 25)">
    <rect class="card" width="168" height="190"/>
    <rect x="16" y="18" width="36" height="36" class="icon-bg"/>
    <text x="34" y="42" font-size="20" text-anchor="middle">🗺️</text>
    <rect x="60" y="24" width="64" height="22" class="badge-bg"/>
    <text x="92" y="39" class="badge" text-anchor="middle">STAP 4</text>
    <text x="16" y="80" class="title">Kaart &amp; Resultaat</text>
    <text x="16" y="104" class="desc">
      <tspan x="16" dy="0">Interactieve kaart met</tspan>
      <tspan x="16" dy="18">echte wegen, stops,</tspan>
      <tspan x="16" dy="18">openbaar vervoer en</tspan>
      <tspan x="16" dy="18">exacte reistijden.</tspan>
    </text>
  </g>
</svg>
