[project]
name = "busroutes"
version = "0.2.0"
description = "Scenario-evaluator voor de schoolbusroutes van 'de pass' (Hoegaarden)"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
busroutes = "busroutes.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["busroutes"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["plugin"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"busroutes/render.py" = ["E501"]  # embedded HTML/CSS/JS template

[tool.pytest.ini_options]
testpaths = ["tests"]
